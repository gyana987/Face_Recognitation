; Multi-camera search: look for ONE missing person across MULTIPLE camera
; feeds at once, each with its own live window. Add/remove cameras by
; editing CAMERA_IDS and adding/removing a matching [camera:<id>] section.

[general]
; A clear photo of the missing person -- a full person crop (with some body
; context) works better than a tight face-only crop, since the detector
; needs a little surrounding context to re-find the face after upscaling.
MISSING_PERSON_IMAGE = /home/gyana/person_face_pipeline/input/reference/Photo from 2026-09-09 15-08-16.967392.jpeg
CAMERA_IDS = cam1, cam2
OUTPUT_DIR = output/search_results

; Cosine-similarity cutoff (ArcFace embeddings) to consider a face a
; candidate match. Typical same-person similarity is 0.40-0.60; raise for
; stricter matching (fewer false positives), lower for more lenient.
SIMILARITY_THRESHOLD = 0.40

; Save exactly what the live window shows (cameras + reference photo +
; alert box, composited) to OUTPUT_DIR/window_output.mp4, so the demo can
; be replayed afterwards without re-running the live search.
SAVE_WINDOW_VIDEO = true
WINDOW_VIDEO_FPS = 8

; Process every Nth frame per camera. NOTE: for a video FILE, total scan
; time is now always ~= the video's real duration either way (see the
; real-time pacing note in search_multi_camera.py) -- EVERY no longer makes
; the scan itself faster. What it DOES control is how often the window
; updates: update interval = EVERY / video_fps. A low-fps source video
; (e.g. 10fps) with a high EVERY here looks frozen/stuck, not live -- keep
; EVERY low (3-5) for a smooth "live" feel; raise it only to cut GPU load
; if the detector can't keep up in real time on a live camera/RTSP feed.
EVERY = 5
DEVICE = auto

; ---- Detection (same meaning as the main pipeline's config) -------------
PERSON_CONF = 0.25
; Lowered from 1280 for demo speed -- still accurate enough for Wildtrack's
; distances; raise back to 1280 if you need to catch smaller/farther faces.
PERSON_IMGSZ = 960
DET_SIZE_W = 640
DET_SIZE_H = 640
MIN_FACE_PX = 28
UPSCALE_BELOW = 220
MAX_UPSCALE = 4.0

[camera:cam1]
INPUT_VIDEO = 0
#/home/gyana/person_face_pipeline/input/loitering_v2.mp4

[camera:cam2]
INPUT_VIDEO = 0#/home/gyana/person_face_pipeline/input/video.mp4
