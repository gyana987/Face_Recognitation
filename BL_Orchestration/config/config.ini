[MISSING_PERSON_FACE_EXTRACTION]
DEVICE = auto
DET_SIZE_W = 640
DET_SIZE_H = 640
MIN_FACE_PX = 28
FACE_DET_CONF = 0.40
BLUR_MIN = 30.0
UPSCALE_BELOW = 220
MAX_UPSCALE = 4.0
BEST_FACES_DIR = output/best_faces

; Face-embedding ReID: cosine-similarity cutoff (on ArcFace's 512-d
; normalized embeddings) to merge a new track_id into an existing
; global_person_id instead of minting a new one. Typical ArcFace
; same-person similarity is 0.4-0.6; raise it to be stricter (fewer merges,
; more distinct IDs), lower it to be more lenient (more merges, risk of
; merging two different people who look alike).
REID_THRESHOLD = 0.45

; Composite quality-score weights (should sum to ~1.0)
SCORE_W_CONF = 0.35
SCORE_W_SHARP = 0.30
SCORE_W_SIZE = 0.15
SCORE_W_FRONTAL = 0.20

; Score normalization reference points
SHARP_REF_MAX = 400.0
SIZE_REF_MAX = 200.0
